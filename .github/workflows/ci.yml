name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: 1. Build
        run: pnpm build

      - name: 2. Unit tests
        run: pnpm test:run

      - name: 3. Coverage (corta si src/domain baja del 90%)
        run: pnpm coverage